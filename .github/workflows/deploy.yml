name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 한 번에 하나만. 새 푸시가 오면 진행 중이던 배포는 취소.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 1. 검증 + 빌드 ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --force

      - name: Type check
        run: npx tsc --noEmit

      # base_path 를 내보내 준다.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      # SPA 라우터를 나중에 붙일 때를 위한 폴백
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 2. 배포 (main 푸시일 때만) ────────────────────────────────────
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
